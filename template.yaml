AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VCALM credential issuer for the LCW sandbox: an exchange endpoint that
  issues one kind of credential (DIDAuth-bound to the wallet's DID), plus
  the S3+CloudFront-hosted collection page from which wallets claim it.

Parameters:
  IssuerSeed:
    Type: String
    NoEcho: true
    Description: >
      64-char hex seed for the issuer's Ed25519 signing key (its did:key is
      derived from this). Keep it stable: the derived DID is what verifiers
      register.
  DomainName:
    Type: String
    Description: Domain for the collection page.
    Default: issuer.lcw-sandbox.org
  CertificateArn:
    Type: String
    Description: ACM certificate (us-east-1) covering DomainName.
    Default: arn:aws:acm:us-east-1:747170788015:certificate/c63f6ba4-2630-4c4f-973f-4fd6436962f0
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone for DomainName.
    Default: Z04250862QG6MQUAE24XV
  StatusApiBase:
    Type: String
    Description: Base URL of the Bitstring Status List service (no trailing slash).
    Default: https://status.lcw-sandbox.org
  StatusApiKey:
    Type: String
    NoEcho: true
    Description: The status list service's x-api-key for /allocate.
  NotifyFromEmail:
    Type: String
    Description: >
      Address claim-notification emails are sent from. Must be covered by a
      verified SES identity in this account/region.
    Default: issuer@lcw-sandbox.org
  SesIdentity:
    Type: String
    Description: The verified SES identity NotifyFromEmail sends under.
    Default: lcw-sandbox.org
  TemplatesApiBase:
    Type: String
    Description: >
      Base URL of the credential-templates API (no trailing slash). The batch
      exchange POSTs {base}/templates/{templateId} to populate a credential at
      collection time.
    Default: https://f1exkuo3g0.execute-api.us-east-1.amazonaws.com/Prod

Resources:
  IssuerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'

  # Exchange state: challenge, status, and the issued result, expiring via TTL.
  ExchangesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: exchangeId
          AttributeType: S
      KeySchema:
        - AttributeName: exchangeId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  IssuerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-sandbox-issuer
      Description: VCALM workflow exchanges that issue the LCW Sandbox Badge
      CodeUri: src/issuer
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      MemorySize: 512
      # Cold starts resolve DIDs and fetch JSON-LD contexts
      Timeout: 20
      Environment:
        Variables:
          ISSUER_SEED: !Ref IssuerSeed
          TABLE_NAME: !Ref ExchangesTable
          COLLECTION_PAGE_URL: !Sub https://${DomainName}
          NOTIFY_FROM_EMAIL: !Ref NotifyFromEmail
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExchangesTable
        - SESCrudPolicy:
            IdentityName: !Ref SesIdentity
      Events:
        CreateExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/{workflowId}/exchanges
            Method: post
        ParticipateExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/{workflowId}/exchanges/{exchangeId}
            Method: post
        GetExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/{workflowId}/exchanges/{exchangeId}
            Method: get
        Notify:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/{workflowId}/notifications
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # ---- batch notification: per-credential encrypted bundles + emails

  # Encrypts the per-credential bundles staged at notification time; the
  # per-credential context UUID (carried only in the recipient's email) is
  # bound in as encryption context, so decryption at collection time requires
  # presenting it back.
  BundlesKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts staged credential bundles for batch issuance
      EnableKeyRotation: true

  BundlesKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/lcw-credential-bundles
      TargetKeyId: !Ref BundlesKey

  # credId -> batch space pointer, so the collection endpoint can find the
  # bucket holding the (single) ciphertext copy of a bundle.
  BundlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: credId
          AttributeType: S
      KeySchema:
        - AttributeName: credId
          KeyType: HASH

  # Emails every recipient in a batch a collection link, staging an encrypted
  # bundle per credential in the batch's WAS space. zcap-authenticated against
  # the account's registered DID (the same scheme as lcw-back-end's /spaces).
  BatchNotifyFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-batch-notify
      Description: Stages encrypted credential bundles and emails batch recipients
      CodeUri: src/notify
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      MemorySize: 512
      # The loop is sequential I/O per recipient (KMS + S3 + DynamoDB + SES);
      # 300s covers several hundred recipients.
      Timeout: 300
      Environment:
        Variables:
          # Accounts and spaces tables are owned by the lcw-back-end stack.
          TABLE_NAME: wallet-test
          SPACES_TABLE_NAME: wallet-spaces
          BUNDLES_TABLE_NAME: !Ref BundlesTable
          BUNDLES_KEY_ID: !Ref BundlesKey
          COLLECTION_PAGE_URL: !Sub https://${DomainName}
          NOTIFY_FROM_EMAIL: !Ref NotifyFromEmail
      Policies:
        - DynamoDBReadPolicy:
            TableName: wallet-test
        - DynamoDBReadPolicy:
            TableName: wallet-spaces
        - DynamoDBCrudPolicy:
            TableName: !Ref BundlesTable
        - SESCrudPolicy:
            IdentityName: !Ref SesIdentity
        - KMSEncryptPolicy:
            KeyId: !Ref BundlesKey
        # Bundles and logs are written into the batch's WAS space bucket;
        # space buckets all share the dcc-was- prefix. ListBucket on the
        # buckets is required for a GET of a missing key to come back as
        # NoSuchKey (404) rather than AccessDenied (403) — the handler reads
        # log.json and the collection descriptions before they exist.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/*
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
      Events:
        BatchNotify:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /notify
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # VC-API exchanges for the batch-credential workflow: a recipient's emailed
  # credId+ctx (via the collection page) becomes a DIDAuth-bound credential,
  # decrypted from the bundle the notify lambda staged, populated by the
  # credential-templates API, and signed with the batch's own seed. Separate
  # from the badge issuer; the literal path segments below take precedence
  # over IssuerFn's {workflowId} wildcard routes (HTTP APIs route by most
  # specific match). Shares ExchangesTable with the badge issuer; batch rows
  # are distinguished by their credId attribute.
  BatchExchangeFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-batch-exchange
      Description: VCALM workflow exchanges that deliver staged batch credentials
      CodeUri: src/batch-exchange
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      MemorySize: 512
      # Cold starts resolve DIDs and fetch JSON-LD contexts
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref ExchangesTable
          BUNDLES_TABLE_NAME: !Ref BundlesTable
          TEMPLATES_API_BASE: !Ref TemplatesApiBase
          # Status positions are allocated at collection time.
          STATUS_API_BASE: !Ref StatusApiBase
          STATUS_API_KEY: !Ref StatusApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExchangesTable
        - DynamoDBReadPolicy:
            TableName: !Ref BundlesTable
        - KMSDecryptPolicy:
            KeyId: !Ref BundlesKey
        # Reads bundles from, and writes collection log entries to, the batch
        # WAS space buckets (all share the dcc-was- prefix). ListBucket on the
        # buckets is required for a GET of a missing key to come back as
        # NoSuchKey (404) rather than AccessDenied (403) — a deleted bundle
        # must map to the clean invalid-link 400, not a 500.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/*
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
      Events:
        CreateBatchExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/batch-credential/exchanges
            Method: post
        ParticipateBatchExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/batch-credential/exchanges/{exchangeId}
            Method: post
        GetBatchExchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref IssuerHttpApi
            Path: /workflows/batch-credential/exchanges/{exchangeId}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # ---- the collection page: private bucket behind CloudFront (CHAPI needs a
  # secure context, which the S3 website endpoint cannot provide)

  CollectionPageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lcw-issuer-page-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CollectionPageOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub lcw-issuer-page-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CollectionPageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: LCW sandbox issuer collection page
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: page-bucket
            DomainName: !GetAtt CollectionPageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CollectionPageOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: page-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  CollectionPageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CollectionPageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${CollectionPageBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CollectionPageDistribution}

  CollectionPageDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CollectionPageDistribution.DomainName

  CollectionPageDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CollectionPageDistribution.DomainName

Outputs:
  ExchangeApi:
    Description: Base URL of the issuer exchange API
    Value: !Sub https://${IssuerHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CollectionPageUrl:
    Description: URL of the collection page
    Value: !Sub https://${DomainName}
  CollectionPageBucket:
    Description: Bucket the built collection page syncs to
    Value: !Ref CollectionPageBucket
  CollectionPageDistributionId:
    Description: CloudFront distribution to invalidate after a sync
    Value: !Ref CollectionPageDistribution
